<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540"><rect width="1000" height="540" fill="#f8fafc"/><text x="36" y="42" font-size="22" fill="#0f172a">教学算例：假设每页容纳 3 条 payload 记录</text><polyline points="165.0,149 165.0,194.5 165.0,194.5 165.0,240" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="160.0,232 170.0,232 165.0,240" fill="#64748b"/><polyline points="500.0,149 500.0,194.5 500.0,194.5 500.0,240" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="495.0,232 505.0,232 500.0,240" fill="#64748b"/><polyline points="835.0,149 835.0,194.5 835.0,194.5 835.0,240" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="830.0,232 840.0,232 835.0,240" fill="#64748b"/><rect x="30" y="75" width="270" height="74" rx="14" fill="#e0f2fe" stroke="#0369a1"/><text x="165.0" y="104" text-anchor="middle" font-size="18" fill="#0369a1">幸存 ID：0、1、4</text><text x="165.0" y="128" text-anchor="middle" font-size="18" fill="#0369a1">对应页号：0、0、1</text><rect x="360" y="75" width="280" height="74" rx="14" fill="#ffedd5" stroke="#c2410c"/><text x="500.0" y="104" text-anchor="middle" font-size="18" fill="#c2410c">筛掉 ID 2</text><text x="500.0" y="128" text-anchor="middle" font-size="18" fill="#c2410c">但 0、1 仍需读取页 0</text><rect x="700" y="75" width="270" height="74" rx="14" fill="#ede9fe" stroke="#6d28d9"/><text x="835.0" y="104" text-anchor="middle" font-size="18" fill="#6d28d9">最终重排：ID 1、4</text><text x="835.0" y="128" text-anchor="middle" font-size="18" fill="#6d28d9">再次请求页 0、1</text><rect x="30" y="240" width="270" height="74" rx="14" fill="#dcfce7" stroke="#15803d"/><text x="165.0" y="269" text-anchor="middle" font-size="18" fill="#15803d">批内 coalescing</text><text x="165.0" y="293" text-anchor="middle" font-size="18" fill="#15803d">3 个页请求 → 2 个唯一页</text><rect x="360" y="240" width="280" height="74" rx="14" fill="#ffedd5" stroke="#c2410c"/><text x="500.0" y="269" text-anchor="middle" font-size="18" fill="#c2410c">页 0：[0 | 1 | 2]</text><text x="500.0" y="293" text-anchor="middle" font-size="18" fill="#c2410c">页 1：[3 | 4 | 5]</text><rect x="700" y="240" width="270" height="74" rx="14" fill="#dcfce7" stroke="#15803d"/><text x="835.0" y="269" text-anchor="middle" font-size="18" fill="#15803d">若仍命中 query 缓存</text><text x="835.0" y="293" text-anchor="middle" font-size="18" fill="#15803d">新增物理页读取 = 0</text><text x="36" y="480" font-size="17" fill="#334155">页命中省的是再次读取；缓存驱逐后仍可能重新读盘。</text><text x="36" y="505" font-size="17" fill="#334155">遍历时 compact 与 residual 已随同一记录读取；重排可以直接命中这些页。</text></svg>