<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540"><rect width="1000" height="540" fill="#f8fafc"/><text x="36" y="42" font-size="22" fill="#0f172a">先用内存 DB1 判断，再为幸存候选读取 payload</text><polyline points="500.0,149 500.0,177.0 500.0,177.0 500.0,205" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="495.0,197 505.0,197 500.0,205" fill="#64748b"/><polyline points="500.0,279 500.0,312.0 185.0,312.0 185.0,345" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="180.0,337 190.0,337 185.0,345" fill="#64748b"/><text x="195.0" y="305.0" font-size="15" fill="#475569">是</text><polyline points="500.0,279 500.0,312.0 662.5,312.0 662.5,345" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="657.5,337 667.5,337 662.5,345" fill="#64748b"/><text x="672.5" y="305.0" font-size="15" fill="#475569">否 / 未满 / 无效</text><rect x="330" y="75" width="340" height="74" rx="14" fill="#dcfce7" stroke="#15803d"/><text x="500.0" y="104" text-anchor="middle" font-size="18" fill="#15803d">读当前节点的磁盘邻接表</text><text x="500.0" y="128" text-anchor="middle" font-size="18" fill="#15803d">收集未访问邻居并标记 visited</text><rect x="330" y="205" width="340" height="74" rx="14" fill="#e0f2fe" stroke="#0369a1"/><text x="500.0" y="234" text-anchor="middle" font-size="18" fill="#0369a1">DB1 × INT8：得到 LB 与 sₓ</text><text x="500.0" y="258" text-anchor="middle" font-size="18" fill="#0369a1">池满且 valid 且 LB &gt; τ？</text><rect x="45" y="345" width="280" height="74" rx="14" fill="#ffedd5" stroke="#c2410c"/><text x="185.0" y="374" text-anchor="middle" font-size="18" fill="#c2410c">是：丢弃该候选</text><text x="185.0" y="398" text-anchor="middle" font-size="18" fill="#c2410c">不为它请求 payload</text><rect x="390" y="345" width="545" height="74" rx="14" fill="#ede9fe" stroke="#6d28d9"/><text x="662.5" y="374" text-anchor="middle" font-size="18" fill="#6d28d9">否：读页 → 复用 sₓ 算 4-bit 距离 → 更新池</text><text x="662.5" y="398" text-anchor="middle" font-size="18" fill="#6d28d9">池无未扩展节点后，浮点 query + residual4 重排</text><text x="36" y="480" font-size="17" fill="#334155">图邻接页在筛选前已读；DB1 主要避免的是候选 payload 读取。</text><text x="36" y="505" font-size="17" fill="#334155">丢弃候选不会自动带来等量页数下降：同页可能还有其他幸存候选。</text></svg>