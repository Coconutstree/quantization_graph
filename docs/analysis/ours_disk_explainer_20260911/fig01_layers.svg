<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540"><rect width="1000" height="540" fill="#f8fafc"/><text x="36" y="42" font-size="22" fill="#0f172a">一份数据库编码，支撑三种计算精度</text><polyline points="500.0,154 500.0,184.5 500.0,184.5 500.0,215" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="495.0,207 505.0,207 500.0,215" fill="#64748b"/><polyline points="500.0,289 500.0,319.5 175.0,319.5 175.0,350" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="170.0,342 180.0,342 175.0,350" fill="#64748b"/><text x="185.0" y="312.5" font-size="15" fill="#475569">提取</text><polyline points="500.0,289 500.0,319.5 505.0,319.5 505.0,350" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="500.0,342 510.0,342 505.0,350" fill="#64748b"/><text x="515.0" y="312.5" font-size="15" fill="#475569">编码误差</text><polyline points="500.0,289 500.0,319.5 830.0,319.5 830.0,350" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="825.0,342 835.0,342 830.0,350" fill="#64748b"/><text x="840.0" y="312.5" font-size="15" fill="#475569">离线建图</text><rect x="335" y="80" width="330" height="74" rx="14" fill="#e0f2fe" stroke="#0369a1"/><text x="500.0" y="109" text-anchor="middle" font-size="18" fill="#0369a1">x → 减质心 / 归一化 / 旋转</text><text x="500.0" y="133" text-anchor="middle" font-size="18" fill="#0369a1">得到 u 与真实模长 nₓ</text><rect x="335" y="215" width="330" height="74" rx="14" fill="#ede9fe" stroke="#6d28d9"/><text x="500.0" y="244" text-anchor="middle" font-size="18" fill="#6d28d9">4-bit 主码 k 与比例 λₓ</text><text x="500.0" y="268" text-anchor="middle" font-size="18" fill="#6d28d9">构建 Vamana 图 / 在线打分</text><rect x="35" y="350" width="280" height="74" rx="14" fill="#e0f2fe" stroke="#0369a1"/><text x="175.0" y="379" text-anchor="middle" font-size="18" fill="#0369a1">内存：DB1 + 筛选系数</text><text x="175.0" y="403" text-anchor="middle" font-size="18" fill="#0369a1">从主码提取最高位 b</text><rect x="365" y="350" width="280" height="74" rx="14" fill="#ffedd5" stroke="#c2410c"/><text x="505.0" y="379" text-anchor="middle" font-size="18" fill="#c2410c">磁盘：完整主码 + residual4</text><text x="505.0" y="403" text-anchor="middle" font-size="18" fill="#c2410c">补偿主码的剩余误差</text><rect x="695" y="350" width="270" height="74" rx="14" fill="#dcfce7" stroke="#15803d"/><text x="830.0" y="379" text-anchor="middle" font-size="18" fill="#15803d">磁盘：Vamana 邻接表</text><text x="830.0" y="403" text-anchor="middle" font-size="18" fill="#15803d">扩展节点时读取</text><text x="36" y="480" font-size="17" fill="#334155">DB1 是主码最高位的内存副本；磁盘主码仍保存完整 4 bit。</text><text x="36" y="505" font-size="17" fill="#334155">residual4 是另一组量化误差码，不是主码剩下的 3 bit。</text></svg>