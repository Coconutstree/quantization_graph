[package]
name = "diskann-fair"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "run_diskann_fair"
path = "src/main.rs"

[[bin]]
name = "qgraph05_shared_graph_port"
path = "../../experiments/02_disk_shared_graph/native/src/main.rs"

[dependencies]
diskann = { path = "../../baselines/diskann/diskann" }
diskann-providers = { path = "../../baselines/diskann/diskann-providers" }
diskann-quantization = { path = "../../baselines/diskann/diskann-quantization", features = ["rayon", "linalg"] }
diskann-utils = { path = "../../baselines/diskann/diskann-utils", features = ["rayon"] }
diskann-vector = { path = "../../baselines/diskann/diskann-vector" }
rand = "0.9.3"
serde_json = "1"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }

# Match baselines/diskann's release profile so both sides of the 03 comparison
# are built with the same optimization settings.
[profile.release]
opt-level = 3
codegen-units = 1
debug = true
split-debuginfo = "packed"
